url: https://validate-hta.github.io/testhta/
template:
  bootstrap: 5
  bootswatch: flatly

navbar:
  structure:
    left:  [intro, reference, articles, news]
    right: [github]
  components:
    intro:
      text: "Get Started"
      href: articles/introduction.html
    articles:
      text: "Guides"
      menu:
        - text: "The HTA Verification Framework (T01–T12)"
          href: articles/verification-framework.html
        - text: "R Test Code Examples"
          href: articles/basic-tests.html
        - text: "Custom Expectations and Advanced Testing"
          href: articles/validation-guide.html
        - text: "Automating Tests and AI-Assisted Verification"
          href: articles/automating-hta-unit-tests.html

reference:
  - title: "Test Suite Generator"
    desc: "Scaffolding functions to automatically generate unit testing infrastructure for HTA models."
    contents:
      - use_hta_unittests
  - title: "Model Validation & Verification Helpers"
    desc: "Exported assertion functions to write automated unit tests and check model boundaries."
    contents:
      - run_model
      - check_model_qalys
      - check_model_costs
      - check_model_le
      - check_model_le_pp
      - compare_model_runs
  - title: "Model Setters & Getters"
    desc: "Helper functions to modify input parameters, query parameter matrices by treatment arm, and extract outcomes during test execution."
    contents:
      - set_discount_rate
      - set_costs
      - set_p_matrix
      - set_utilities
      - set_time_horizon
      - get_state_costs
      - get_state_utilities
      - get_transition_matrix
      - get_qalys
      - get_qalys_pp
      - get_costs
      - get_costs_pp
      - get_le
      - get_le_pp
      - get_icer
      - get_incremental_costs
      - get_incremental_qalys
      - get_arm_names
  - title: "Example Case Study Model"
    desc: "The cohort Markov model engine and baseline dataset used as the demonstration environment in the tutorial paper."
    contents:
      - ce_markov
      - p_matrix_cycle
      - sample_psa_parameters
      - base_params
      - test_data
